blueprint_standard:

  identity:

    name: Financial Intelligence OS Blueprint Standard

    short_name: Blueprint Standard

    version: 1.0

    status: Active

  objective: >
    Define the official structure, conventions, naming rules,
    validation rules and metadata requirements that every
    Financial Intelligence OS blueprint must follow.

  philosophy:

    single_source_of_truth: true

    reusable_structure: true

    automation_first: true

    validation_first: true

    generator_friendly: true

    scalable_design: true

  blueprint_structure:

    required_sections:

      - objective

      - categories

      - metadata

    category_structure:

      required_sections:

        - objective

        - items

    item_structure:

      required_fields:

        - id

        - name

        - description

        - purpose

        - milestone

        - priority

        - status

        - owner

        - dependencies

        - inputs

        - outputs

        - future_extensions

  naming_conventions:

    files:

      numbering: true

      lowercase: true

      snake_case: true

      extension: ".yaml"

    keys:

      lowercase: true

      snake_case: true

    ids:

      unique: true

      immutable: true

  id_prefixes:

    phases: PHASE

    engines: ENG

    products: PROD

    technologies: TECH

    skills: SKILL

    users: USER

    datasources: DATA

    workflows: FLOW

    automation: AUTO

    intelligence: INT

    architecture: ARCH

  status_values:

    - Planned

    - Active

    - Completed

    - Deprecated

    - Archived

  priority_values:

    - Critical

    - High

    - Medium

    - Low

    - Future

  dependency_rules:

    allow_multiple_dependencies: true

    dependency_reference: id

    circular_dependencies: false

  metadata_standard:

    required_fields:

      - blueprint

      - version

      - status

      - owner

      - maintained_by

      - last_updated

  validation_rules:

    - Every blueprint must contain metadata

    - Every item must have a unique ID

    - Every item must define a milestone

    - Every item must define a status

    - Every item must define a priority

    - Every dependency must reference an existing ID

    - No duplicate IDs are allowed

    - No circular dependencies are allowed

  generator_requirements:

    compatible_with:

      - README Generator

      - Documentation Generator

      - Excel Generator

      - Dashboard Generator

      - JSON Generator

      - Validator Engine

      - Monitoring Engine

      - Automation Engine

      - Future AI Assistant


    statement: >
      Monitor the operational performance of Financial Intelligence OS
      by tracking execution efficiency, automation performance,
      resource utilization, and overall system responsiveness.

  monitoring:

    enabled: true

    tracking_mode: Manual

    measurement_unit: Percentage

  execution:

    startup_time: Unknown

    execution_time: Unknown

    response_time: Unknown

    throughput: Unknown

  automation:

    success_rate: Unknown

    failed_runs: Unknown

    completed_runs: Unknown

    average_runtime: Unknown

  resources:

    cpu_usage: Unknown

    memory_usage: Unknown

    disk_usage: Unknown

    network_usage: Unknown

  data:

    ingestion_speed: Unknown

    processing_speed: Unknown

    report_generation_speed: Unknown

  scoring:

    efficiency: 0

    reliability: 0

    stability: 0

    performance_score: 0


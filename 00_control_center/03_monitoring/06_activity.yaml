activity:

  vision:

    statement: >
      Record and monitor significant activities across Financial
      Intelligence OS including development milestones,
      blueprint updates, validation runs, automation events,
      releases, and deployments.

  monitoring:

    enabled: true

    tracking_mode: Manual

    activity_retention: Unlimited

  development:

    commits:

      enabled: true

      status: Active

    milestones:

      enabled: true

      status: Active

    releases:

      enabled: true

      status: Planned

  blueprint:

    updates:

      enabled: true

      status: Active

    validation:

      enabled: true

      status: Planned

  automation:

    executions:

      enabled: true

      status: Planned

    schedules:

      enabled: true

      status: Planned

  deployment:

    deployments:

      enabled: true

      status: Planned

    rollbacks:

      enabled: true

      status: Planned

summary:

  last_activity: Unknown

  last_commit: Unknown

  next_activity: Complete Monitoring System


orchestration:

  objective: >
    Coordinate and manage the execution of multiple workflows,
    pipelines, generators, validators, and monitoring components
    across Financial Intelligence OS.

  orchestration_modes:

    sequential:

      enabled: true

      description: Execute workflows one after another.

    parallel:

      enabled: true

      description: Execute independent workflows simultaneously.

    dependency_based:

      enabled: true

      description: Execute workflows only after prerequisite tasks complete.

    event_driven:

      enabled: Planned

      description: Trigger workflows from system events.

  coordination:

    workflow_dependencies: true

    task_priorities: true

    queue_management: true

    execution_history: true

  scheduling:

    supports_manual: true

    supports_scheduled: true

    supports_recurring: true

    supports_conditional: Planned

  monitoring:

    track_execution: true

    track_failures: true

    track_duration: true

    generate_summary: true

metadata:

  version: 1.0

  status: Active

  last_updated: 2026-08-02
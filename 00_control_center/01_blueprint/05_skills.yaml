      Financial Intelligence OS is built by combining software engineering,
      finance, analytics, artificial intelligence, and business knowledge
      into one continuously evolving skill ecosystem.

  categories:

    software_engineering:

      description: Core software development competencies.

      skills:

        - Python
        - Object-Oriented Programming
        - Software Architecture
        - Design Patterns
        - API Development
        - Testing

datasources:

  vision:

    statement: >
      Financial Intelligence OS integrates trusted financial,
      economic, business, and market data sources to power
      reusable intelligence engines and decision-support systems.

  categories:

    market_data:

      description: Stock market and trading data.

      sources:

        - Yahoo Finance
        - Alpha Vantage
        - Twelve Data
        - Polygon.io
        - Finnhub
        - NSE India
        - BSE India

    economic_data:

      description: Macroeconomic and policy data.

      sources:

        - FRED
        - World Bank
        - IMF
        - OECD
        - RBI
        - MOSPI

    company_data:

      description: Company fundamentals and financial statements.

      sources:

        - SEC EDGAR
        - NSE Corporate Filings
        - BSE Corporate Announcements
        - Company Annual Reports

    alternative_data:

      description: Alternative and sentiment-based datasets.

      sources:

        - News APIs
        - RSS Feeds
        - Social Media
        - Google Trends
        - Weather Data

    government_data:

      description: Government and public datasets.

      sources:

        - data.gov.in
        - Open Government Data
        - SEBI
        - MCA
        - GST Statistics

    internal_data:

      description: User-generated and project-managed datasets.

      sources:

        - CSV Files
        - Excel Files
        - JSON Files
        - SQL Databases
        - User Uploads

metadata:

  version: 1.0

  maintained_by: Priyansh Soni

  last_updated: 2026-08-02
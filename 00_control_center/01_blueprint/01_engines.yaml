engines:

  objective: >
    Define every engine that powers Financial Intelligence OS.
    Each engine represents a reusable system responsible for
    automation, intelligence, data processing, monitoring,
    reporting and decision support.

  categories:

    core_engines:

      objective: >
        Core operating system engines responsible for running FIOS.

      items:

        generator_engine:

          id: ENG-001

          type: Core Engine

          name: Generator Engine

          description: Generate reusable project artifacts automatically.

          purpose: Automate artifact generation.

          milestone: PHASE-003

          priority: Critical

          status: Planned

          owner: Financial Intelligence OS

          tags:

            - generator

            - automation

          dependencies:

            - PHASE-002

          inputs:

            - Blueprint

            - Templates

          outputs:

            - Documentation

            - Reports

            - Dashboards

            - Excel

          future_extensions:

            - AI Generator

        validator_engine:

          id: ENG-002

          type: Core Engine

          name: Validator Engine

          description: Validate blueprint integrity and project quality.

          purpose: Ensure consistency.

          milestone: PHASE-004

          priority: Critical

          status: Planned

          owner: Financial Intelligence OS

          tags:

            - validation

            - quality

          dependencies:

            - ENG-001

          inputs:

            - Blueprint

          outputs:

            - Validation Reports

          future_extensions:

            - AI Validation

        monitoring_engine:

          id: ENG-003

          type: Core Engine

          name: Monitoring Engine

          description: Monitor execution, health and project metrics.

          purpose: Measure project health.

          milestone: PHASE-005

          priority: High

          status: Planned

          owner: Financial Intelligence OS

          tags:

            - monitoring

            - metrics

          dependencies:

            - ENG-002

          inputs:

            - Validation Reports

          outputs:

            - Health Metrics

          future_extensions:

            - Predictive Monitoring

        automation_engine:

          id: ENG-004

          type: Core Engine

          name: Automation Engine

          description: Automate repetitive workflows and scheduled tasks.

          purpose: Reduce manual effort.

          milestone: PHASE-006

          priority: High

          status: Planned

          owner: Financial Intelligence OS

          tags:

            - automation

            - scheduler

          dependencies:

            - ENG-003

          inputs:

            - Monitoring Metrics

          outputs:

            - Automated Workflows

          future_extensions:

            - Self-Healing Automation

        dashboard_engine:

          id: ENG-005

          type: Core Engine

          name: FIOS Live Dashboard

          description: Operate Financial Intelligence OS from one live dashboard.

          purpose: Central operating dashboard.

          milestone: PHASE-007

          priority: High

          status: Planned

          owner: Financial Intelligence OS

          tags:

            - dashboard

            - control-center

          dependencies:

            - ENG-004

          inputs:

            - Automation

          outputs:

            - Live Dashboard

          future_extensions:

            - AI Copilot

    data_engines:

      objective: >
        Collect, process and manage data.

      items:

        data_acquisition_engine:

          id: ENG-006

          type: Data Engine

          name: Data Acquisition Engine

          description: Collect financial and business data.

          purpose: Acquire reliable data.

          milestone: PHASE-008

          priority: Critical

          status: Planned

          owner: Financial Intelligence OS

          tags:


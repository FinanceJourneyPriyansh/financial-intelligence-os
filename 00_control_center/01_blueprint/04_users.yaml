users:

  vision:

    statement: >
      Financial Intelligence OS is designed to serve individuals,
      professionals, businesses, and organizations by providing
      intelligent, data-driven financial and business solutions.

  categories:

    learners:

      description: Individuals learning finance, analytics, and technology.

      users:

        - Students
        - Job Seekers
        - Researchers
        - Educators

    professionals:

      description: Professionals using financial intelligence in their careers.

      users:

        - Financial Analysts
        - Data Analysts
        - Business Analysts
        - Investment Analysts
        - Risk Analysts
        - Accountants
        - Auditors

    investors:

      description: Individuals and institutions making investment decisions.

      users:

        - Retail Investors
        - Professional Investors
        - Traders
        - Portfolio Managers
        - Wealth Managers

    businesses:

      description: Organizations using intelligence for operations and growth.

      users:

        - Freelancers
        - Startup Founders
        - Business Owners
        - CEOs
        - CXOs
        - Small Businesses
        - Enterprises

    government:

      description: Public sector organizations and policy makers.

      users:

        - Government Organizations
        - Regulators
        - Policy Makers
        - Economic Institutions

    developers:

      description: Technical users extending the FIOS platform.

      users:

        - Python Developers
        - Data Engineers
        - Machine Learning Engineers
        - DevOps Engineers
        - Open Source Contributors


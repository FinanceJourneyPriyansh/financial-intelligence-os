datasources:

  objective: >
    Define all internal and external data sources used by
    Financial Intelligence OS to acquire financial, economic,
    business, market and enterprise information.

  categories:

    financial_market_data:

      objective: >
        Financial market and securities data providers.

      items:

        yahoo_finance:

          id: DATA-001

          name: Yahoo Finance

          status: Planned

        alpha_vantage:

          id: DATA-002

          name: Alpha Vantage

          status: Planned

        finnhub:

          id: DATA-003

          name: Finnhub

          status: Planned

        polygon:

          id: DATA-004

          name: Polygon.io

          status: Planned

    indian_market_data:

      objective: >
        Indian financial market data providers.

      items:

        nse:

          id: DATA-005

          name: National Stock Exchange (NSE)

          status: Planned

        bse:

          id: DATA-006

          name: Bombay Stock Exchange (BSE)

          status: Planned

        sebi:

          id: DATA-007

          name: Securities and Exchange Board of India (SEBI)

          status: Planned

        mca:

          id: DATA-008

          name: Ministry of Corporate Affairs (MCA)

          status: Planned

